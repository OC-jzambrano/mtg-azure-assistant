name: MTG Assistant CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Deterministic & Offline)
        run: |
          pytest tests/unit/ -v

  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      AZURE_RG_NAME: ${{ secrets.AZURE_RG_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to ACR
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build & Push Docker Image
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          REGISTRY="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          docker build -t $REGISTRY/mtg-assistant:${{ github.sha }} -t $REGISTRY/mtg-assistant:latest .
          docker push $REGISTRY/mtg-assistant:${{ github.sha }}
          docker push $REGISTRY/mtg-assistant:latest

      - name: Deploy Image to Azure Container Apps
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          az containerapp update \
            --name mtg-assistant-app \
            --resource-group ${{ secrets.AZURE_RG_NAME }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/mtg-assistant:${{ github.sha }}
