name: MTG Assistant CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Deterministic & Offline)
        run: |
          pytest tests/unit/ -v

  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build & Push Docker Image to ACR
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          az acr build \
            --registry ${{ secrets.AZURE_ACR_NAME }} \
            --image mtg-assistant:${{ github.sha }} \
            --image mtg-assistant:latest \
            .

      - name: Deploy Image to Azure Container Apps
        if: ${{ env.AZURE_CLIENT_ID != '' }}
        run: |
          az containerapp update \
            --name mtg-assistant-app \
            --resource-group ${{ secrets.AZURE_RG_NAME }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/mtg-assistant:${{ github.sha }}
