name: MTG Assistant CI/CD

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Unit Tests (Deterministic & Offline)
        run: |
          pytest tests/unit/ -v

  build-and-deploy:
    name: Build & Deploy to Azure Container Apps
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    concurrency:
      group: azure-production
      cancel-in-progress: false
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_ACR_NAME: ${{ secrets.AZURE_ACR_NAME }}
      AZURE_RG_NAME: ${{ secrets.AZURE_RG_NAME }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Validate deployment configuration
        shell: bash
        run: |
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_ACR_NAME AZURE_RG_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing required GitHub secret: $name"
              exit 1
            fi
          done

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Docker Login to ACR
        run: |
          az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build & Push Docker Image
        run: |
          REGISTRY="${{ secrets.AZURE_ACR_NAME }}.azurecr.io"
          docker build -t $REGISTRY/mtg-assistant:${{ github.sha }} -t $REGISTRY/mtg-assistant:latest .
          docker push $REGISTRY/mtg-assistant:${{ github.sha }}
          docker push $REGISTRY/mtg-assistant:latest

      - name: Deploy Image to Azure Container Apps
        run: |
          az containerapp update \
            --name mtg-assistant-app \
            --resource-group ${{ secrets.AZURE_RG_NAME }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/mtg-assistant:${{ github.sha }} \
            --revision-suffix sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} \
            --output none

      - name: Verify deployed revision and public frontend
        shell: bash
        run: |
          revision="mtg-assistant-app--sha-${GITHUB_SHA:0:12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          for attempt in $(seq 1 30); do
            state=$(az containerapp revision show --name mtg-assistant-app \
              --resource-group "$AZURE_RG_NAME" --revision "$revision" \
              --query properties.healthState -o tsv)
            [ "$state" = "Healthy" ] && break
            sleep 10
          done
          [ "$state" = "Healthy" ] || { echo "::error::Revision is not healthy"; exit 1; }
          host=$(az containerapp show --name mtg-assistant-app \
            --resource-group "$AZURE_RG_NAME" --query properties.configuration.ingress.fqdn -o tsv)
          curl --fail --retry 12 --retry-all-errors --retry-delay 5 "https://$host/health"
          for attempt in $(seq 1 12); do
            matched=true
            for asset in index.html app.js standalone.css vendor/ai_sidebar.css; do
              curl --fail --silent --show-error "https://$host/chat/$asset?revision=$GITHUB_SHA" -o /tmp/deployed-asset || { matched=false; break; }
              cmp --silent "src/ui/web/$asset" /tmp/deployed-asset || { matched=false; break; }
            done
            [ "$matched" = true ] && break
            sleep 5
          done
          [ "$matched" = true ] || { echo "::error::Public frontend does not match this commit"; exit 1; }
